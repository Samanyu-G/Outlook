<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nativity · tiny games by new makers</title>
    <meta name="description" content="Swipe through tiny games made by new creators. Tap to play, cheer, talk and join crews." />
    <meta name="application-name" content="Nativity" />
    <meta name="theme-color" content="#f5efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#241e1a" media="(prefers-color-scheme: dark)" />
    <!-- Brand icons: generated from /brand/nativity-icon.svg (the official artwork, unedited) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/brand/nativity-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <!-- PWA: lets people "Add to Home screen" and open it full-screen like an app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nativity" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nativity" />
    <meta property="og:title" content="Nativity · tiny games by new makers" />
    <meta property="og:description" content="Swipe through tiny games made by new creators. Tap to play, cheer, talk and join crews." />
    <meta property="og:url" content="https://nativity-sable.vercel.app/" />
    <meta property="og:image" content="https://nativity-sable.vercel.app/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nativity logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nativity · tiny games by new makers" />
    <meta name="twitter:description" content="Swipe through tiny games made by new creators." />
    <meta name="twitter:image" content="https://nativity-sable.vercel.app/brand/og-image.png" />
    <link rel="preload" as="image" href="/brand/nativity-icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" />
    <style>
      /* Boot splash: shown until React mounts, then replaced */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f5efe6; }
      .boot img { width: 96px; height: 96px; }
      @media (prefers-color-scheme: dark) { .boot { background: #241e1a; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading Nativity"><img src="/brand/nativity-icon.svg" width="96" height="96" alt="Nativity" /></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
